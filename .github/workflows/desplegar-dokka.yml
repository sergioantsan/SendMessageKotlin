name: Desplegar Dokka en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Generar documentación Dokka
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar el SDK de Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Configurar Gradle y su caché
        uses: gradle/actions/setup-gradle@v6

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x gradlew

      - name: Generar la documentación HTML con Dokka
        run: ./gradlew :app:dokkaGeneratePublicationHtml --no-daemon --stacktrace

      - name: Comprobar la documentación generada
        run: |
          test -s documentation/index.html
          touch documentation/.nojekyll

      - name: Empaquetar la carpeta generada
        uses: actions/upload-pages-artifact@v4
        with:
          path: documentation

  deploy:
    name: Publicar documentación en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
